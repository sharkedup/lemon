name: Lemon
options:
  bundleIdPrefix: com.kmsharkey
  deploymentTarget:
    iOS: "17.0"
targets:
  Lemon:
    type: application
    platform: iOS
    sources:
      - Lemon
    info:
      path: Lemon/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmsharkey.Lemon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
