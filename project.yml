name: Lemon
options:
  bundleIdPrefix: com.kmsharkey
  deploymentTarget:
    iOS: "17.0"
targets:
  Lemon:
    type: application
    platform: iOS
    sources:
      - Lemon
    info:
      path: Lemon/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "19"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmsharkey.Lemon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: QS983XC69J
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    scheme:
      testTargets:
        - LemonTests
  LemonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LemonTests
    dependencies:
      - target: Lemon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kmsharkey.LemonTests
        DEVELOPMENT_TEAM: QS983XC69J
        CODE_SIGN_STYLE: Automatic
